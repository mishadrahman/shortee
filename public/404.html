<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shortee - URL Shortener</title>
    <script>
      // Single Page Apps for GitHub Pages & static hosting
      // This script takes the current url and converts the path and query
      // into a query string parameter "?p=..." which is read by index.html
      var pathSegmentsToKeep = 0;
      var l = window.location;

      // If running on GitHub Pages (e.g. username.github.io/repo-name), keep 1 segment
      if (l.hostname.indexOf('github.io') > -1) {
        pathSegmentsToKeep = 1;
      }

      var redirectUrl =
        l.protocol +
        '//' +
        l.hostname +
        (l.port ? ':' + l.port : '') +
        l.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/') +
        '/?p=/' +
        l.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
