<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Upper Ribbon Gradient (Vivid Cyan to Royal Blue) -->
    <linearGradient id="shortee-top-grad" x1="20" y1="30" x2="160" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="45%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Lower Ribbon Gradient (Royal Blue to Electric Purple/Violet) -->
    <linearGradient id="shortee-bottom-grad" x1="40" y1="90" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="85%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Inner Fold Shadow Gradient for 3D Depth -->
    <linearGradient id="shortee-fold-shadow" x1="90" y1="85" x2="140" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#312E81" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
    </linearGradient>

    <!-- Sparkle Rays Gradient -->
    <linearGradient id="shortee-sparkle-grad" x1="140" y1="30" x2="180" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0085FF"/>
    </linearGradient>

    <!-- Glow Filter for subtle vibrancy -->
    <filter id="shortee-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0066FF" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Sparkle Accents (Top-Right) -->
  <path d="M 148 42 L 158 28 C 159.5 26 162.5 26 164 28 C 165.5 30 165 33 163 35 L 153 49 C 151.5 51 148.5 51 147 49 C 145.5 47 146 44 148 42 Z" fill="url(#shortee-sparkle-grad)" />
  <path d="M 158 68 L 176 62 C 178.5 61 181 63 181.5 65.5 C 182 68 180 70.5 177.5 71.5 L 159.5 77.5 C 157 78.5 154.5 76.5 154 74 C 153.5 71.5 155.5 69 158 68 Z" fill="url(#shortee-sparkle-grad)" />

  <!-- Main 3D Ribbon S Logo -->
  <g filter="url(#shortee-glow)">
    <!-- Back / Bottom Loop of the 'S' Ribbon -->
    <path
      d="M 64 102
         C 84 80 120 70 144 86
         C 164 99 168 126 150 148
         C 132 170 94 178 56 168
         C 38 163 26 150 30 136
         C 34 122 48 116 62 120
         C 84 127 108 126 118 114
         C 126 104 120 94 106 88
         C 86 80 50 94 36 110
         Z"
      fill="url(#shortee-bottom-grad)"
    />

    <!-- Inner Fold Shadow -->
    <path
      d="M 64 102
         C 84 82 116 76 138 88
         C 126 100 102 110 78 112
         C 68 113 62 108 64 102 Z"
      fill="url(#shortee-fold-shadow)"
    />

    <!-- Top Loop & Front Sweeping Ribbon of the 'S' -->
    <path
      d="M 44 88
         C 30 68 36 40 60 26
         C 88 10 132 14 154 36
         C 166 48 164 62 152 70
         C 140 78 126 74 118 64
         C 106 50 82 46 68 54
         C 56 62 56 74 66 84
         C 84 102 124 114 142 130
         C 162 148 156 172 132 186
         C 102 202 54 196 28 172
         C 18 163 22 150 34 148
         C 44 146 54 154 64 162
         C 80 174 112 176 126 164
         C 136 154 134 144 122 134
         C 102 118 62 106 44 88 Z"
      fill="url(#shortee-top-grad)"
    />
  </g>
</svg>
