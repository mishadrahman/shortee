<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/logo-icon.svg" />
    <title>Shortee - Fast URL Shortener & QR Code Generator</title>
    <meta name="description" content="Shortee (shortee.xyz) is a fast, modern URL shortener with rich destination Open Graph previews for social sharing (WhatsApp, Facebook, Twitter), custom aliases, link expiration, password protection, QR codes, and analytics." />
    <meta property="og:title" content="Shortee - URL Shortener" />
    <meta property="og:description" content="Shortee (shortee.xyz) is a fast, modern URL shortener with rich destination Open Graph previews for social sharing (WhatsApp, Facebook, Twitter), custom aliases, link expiration, password protection, QR codes, and analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Script to restore SPA routes redirected by 404.html -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }

        var search = window.location.search;
        if (search) {
          try {
            var params = new URLSearchParams(search);
            if (params.has('p')) {
              var path = params.get('p') || '/';
              path = '/' + path.replace(/^\/+/, '');
              var query = params.get('q');
              var target = path + (query ? '?' + query.replace(/~and~/g, '&') : '') + window.location.hash;
              window.history.replaceState(null, null, target);
            }
          } catch (e) {
            console.warn('SPA route restore error:', e);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
