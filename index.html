<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shortee - Fast URL Shortener & QR Code Generator</title>
    <meta name="description" content="Shortee (shortee.xyz) is a fast, modern URL shortener with custom aliases, link expiration, instant QR code generation, and click analytics." />
    <meta property="og:title" content="Shortee - Fast URL Shortener & QR Code Generator" />
    <meta property="og:description" content="Shortee (shortee.xyz) is a fast, modern URL shortener with custom aliases, link expiration, instant QR code generation, and click analytics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Script to restore SPA routes redirected by 404.html -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }

        var search = window.location.search;
        if (search) {
          try {
            var params = new URLSearchParams(search);
            if (params.has('p')) {
              var path = params.get('p') || '/';
              path = '/' + path.replace(/^\/+/, '');
              var query = params.get('q');
              var target = path + (query ? '?' + query.replace(/~and~/g, '&') : '') + window.location.hash;
              window.history.replaceState(null, null, target);
            }
          } catch (e) {
            console.warn('SPA route restore error:', e);
          }
        }
      })();
    </script>

    <!-- Instant Pre-Redirector for cached links (Bitly-style 0ms fast path) -->
    <script>
      (function () {
        try {
          var pathname = window.location.pathname || '/';
          var cleanPath = pathname.replace(/^\/+|\/+$/g, '');
          var reservedRoutes = [
            'shortee',
            'dashboard',
            'login',
            'signup',
            'forgot-password',
            'auth',
            'settings',
            'analytics',
            'links',
            'api',
            '404',
            'terms',
            'privacy',
            'about',
            'pricing',
            'profile',
            'admin',
          ];

          // Check if single short code segment and not a reserved route
          if (cleanPath && cleanPath.indexOf('/') === -1 && reservedRoutes.indexOf(cleanPath.toLowerCase()) === -1) {
            var raw = localStorage.getItem('shortee_links_cache') || localStorage.getItem('shortee_local_links');
            if (raw) {
              var links = JSON.parse(raw);
              if (Array.isArray(links)) {
                var match = links.find(function (l) {
                  return l && l.shortCode && l.shortCode.toLowerCase() === cleanPath.toLowerCase();
                });
                if (match && match.originalUrl && match.isActive !== false) {
                  var isExpired = match.expiresAt && new Date(match.expiresAt).getTime() <= Date.now();
                  if (!isExpired) {
                    match.clicks = (match.clicks || 0) + 1;
                    localStorage.setItem('shortee_links_cache', JSON.stringify(links));
                    window.location.replace(match.originalUrl);
                  }
                }
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
